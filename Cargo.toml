[package]
name = "chunklog"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "A version-control library for voxel worlds"
readme = "README.md"

[dependencies]
anyhow = "1"
bincode = "1"
clap = { version = "~4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
anyhow = "1"
criterion = "0.5"
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "storage"
harness = false
