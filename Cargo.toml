[package]
name = "chunklog"
version = "0.3.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "A version-control library for voxel worlds"
readme = "README.md"

[dependencies]
anyhow = "1"
blake3 = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomicwrites = "0.4.4"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
anyhow = "1"
blake3 = "1"
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "storage"
harness = false
