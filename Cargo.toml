[package]
name = "chunklog"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "A version-control library for voxel worlds"
readme = "README.md"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
anyhow = "1"
blake3 = "1"
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "storage"
harness = false
