<!doctype html>
<meta charset="utf-8">
<title>chunklog OPFS benchmark</title>
<script type="module">
  window.runOpfsBenchmark = (request) => new Promise((resolve, reject) => {
    const worker = new Worker("./worker.mjs", { type: "module" });
    worker.onmessage = (event) => {
      if (event.data.progress) {
        console.log(`OPFS_PROGRESS ${JSON.stringify(event.data)}`);
        return;
      }
      worker.terminate();
      event.data.ok ? resolve(event.data.samples) : reject(new Error(event.data.error));
    };
    worker.onerror = (event) => {
      worker.terminate();
      reject(new Error(`${event.message} (${event.filename}:${event.lineno})`));
    };
    worker.postMessage(request);
  });
</script>
